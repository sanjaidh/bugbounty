<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020A"/>
      <stop offset="100%" stop-color="#0F061F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Cyber Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Outer Target / Radar Ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="24 10 30 8"/>
  
  <!-- Target Corner Reticles -->
  <path d="M 22 22 L 32 22 M 22 22 L 22 32" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 78 22 L 68 22 M 78 22 L 78 32" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 22 78 L 32 78 M 22 78 L 22 68" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 78 78 L 68 78 M 78 78 L 78 68" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>

  <!-- Bug Center Body & Head -->
  <ellipse cx="50" cy="54" rx="10" ry="14" fill="url(#bugGrad)"/>
  <circle cx="50" cy="38" r="6" fill="url(#bugGrad)"/>
  
  <!-- Antennae -->
  <path d="M 47 34 L 41 27 M 53 34 L 59 27" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Legs -->
  <path d="M 37 44 L 43 47 M 63 44 L 57 47" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 35 54 L 41 54 M 65 54 L 59 54" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 37 64 L 43 61 M 63 64 L 57 61" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Line Divider -->
  <line x1="50" y1="40" x2="50" y2="67" stroke="#05020A" stroke-width="2.5"/>
</svg>
